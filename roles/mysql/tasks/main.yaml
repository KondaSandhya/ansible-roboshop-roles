    - name: Install boto3 and botocore for AWS Ansible modules
      become: true
      ansible.builtin.dnf:
        name:
          - python3-boto3
          - python3-botocore
        state: present
    - name: install mysql
      ansible.builtin.dnf:
        name: mysql-server
        state: present
    - name: Start and Enable mysqld service
      ansible.builtin.service:
        name: mysqld
        state: started
        enabled: yes
    - name: Set mysql root password
      ansible.builtin.command: mysql_secure_installation --set-root-pass {{ MYSQL_ROOT_PASSWORD }}
